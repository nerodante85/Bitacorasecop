<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Bitácora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{ --forest:#16212E; --lime:#F2B705; --lime-hover:#DDA504; --canvas:#F3F5F7; --ink:#16212E; --muted:#465264; --line:#D9DEE5; }
  html,body{height:100%;margin:0;}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--canvas); color:var(--ink); padding:24px;
  }
  .card{
    max-width:460px; background:#fff; border:1px solid var(--line); border-radius:24px;
    padding:36px 32px; box-shadow:0 1px 2px rgba(14,25,6,.05), 0 12px 30px -22px rgba(14,25,6,.30);
  }
  .mark{
    width:44px; height:44px; border-radius:12px; margin:0 0 22px;
    background:var(--forest); color:var(--lime);
    font-family:'Archivo', 'Inter', sans-serif; font-weight:900; font-size:22px;
    display:flex; align-items:center; justify-content:center;
  }
  h1{
    font-family:'Archivo', 'Inter', sans-serif; font-weight:900; letter-spacing:-.035em;
    font-size:clamp(30px, 8vw, 40px); line-height:.98; margin:0 0 12px; color:var(--forest);
  }
  p{ font-size:15px; line-height:1.6; color:var(--muted); margin:0 0 24px; }
  a{
    display:inline-block; background:var(--lime); color:var(--forest); text-decoration:none;
    font-weight:600; font-size:14px; padding:11px 22px; border-radius:999px;
  }
  a:hover{ background:var(--lime-hover); }
  a:focus-visible{ outline:2px solid var(--forest); outline-offset:3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">B</div>
    <h1>Esta página no existe</h1>
    <p>El enlace puede estar mal escrito o ya no aplica. Bitácora vive en una
       sola página: desde ahí llegas a Buscar procesos, Mis procesos, Empresa
       y Documentos.</p>
    <a href="/Bitacorasecop/">Ir a Bitácora</a>
  </main>
</body>
</html>
