name: Tests de humo

# Alarma temprana en pull requests y a mano. En `main`, las pruebas las ejecuta pages.yml, que además
# BLOQUEA la publicación si fallan (una vez que en GitHub se activa "Pages > Source: GitHub Actions" y la
# variable de repositorio PAGES_POR_ACTIONS = true; ver auditoria/RELEASE-BLOCKERS.md, OPS-001).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA de commit (auditoría SEG-006): un tag como @v4 puede moverse.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Sin `npm install`: tests/smoke.mjs no usa dependencias externas a
      # propósito (el proyecto no tiene package.json ni build step).
      - run: node tests/smoke.mjs

  # F-07 (auditoría 2026-10-06): lo que smoke.mjs no ve -- que el flujo FUNCIONE en pantalla (botones, foco,
  # menú móvil, descargas, análisis guardados). Navegador real (el Chrome del runner), sin red externa: la app cae
  # al snapshot de respaldo, así que es determinista. Playwright solo se instala aquí; el sitio sigue sin dependencias.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - run: node tests/e2e.mjs
