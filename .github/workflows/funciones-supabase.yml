name: Desplegar funciones de Supabase

# OPS-003: despliegue de las Edge Functions desde el repositorio (antes, a mano desde una terminal).
# Solo corre cuando cambia algo en supabase/functions o a mano, y SOLO si las pruebas pasan.
#
# Para activarlo (pasos tuyos, una sola vez):
#   1. En Supabase: Account > Access Tokens > Generate new token (nómbralo "github-deploy").
#   2. En GitHub: Settings > Secrets and variables > Actions > pestaña "Secrets" > New repository secret:
#        SUPABASE_ACCESS_TOKEN = (el token del paso 1; pégalo tú, no lo compartas con nadie)
#   3. Misma pantalla, pestaña "Variables": DEPLOY_FUNCIONES = true
# Sin esa variable el workflow no despliega nada.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/smoke.mjs

  desplegar:
    needs: probar
    if: ${{ vars.DEPLOY_FUNCIONES == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mfqdeqxuwnczexonhlxu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0
      # --use-api: empaqueta en el servidor de Supabase (no necesita Docker en el runner).
      - run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
