# ============================================================================
# Bitácora SECOP — config del proyecto de Supabase (Fase 6: correo/job de
# alertas). Sin este archivo, `supabase functions deploy` exige por defecto
# un JWT válido de Supabase Auth en cada request a la función -- pero
# `daily-digest` la invoca un cron de Postgres (pg_cron/pg_net), no un
# usuario logueado, así que no tiene ningún JWT que mandar. La función ya
# trae su propia protección (compara el header `x-cron-secret` contra el
# secret CRON_SECRET, ver index.ts) -- por eso se desactiva la verificación
# de JWT de la plataforma para esta función puntual, no para todo el
# proyecto.
# ============================================================================
[functions.daily-digest]
verify_jwt = false

# extraer-requisitos la llama el navegador con la sesión activa del usuario
# (supabase-js adjunta el JWT automáticamente) -- verify_jwt = true es el
# default de Supabase, se declara explícito para no depender del default
# y no repetir el diagnóstico de la fase 6 (un 401 misterioso porque no
# estaba declarado).
[functions.extraer-requisitos]
verify_jwt = true

# eliminar-cuenta (PRIV-002, derecho de supresión): la llama el navegador con la sesión del usuario.
[functions.eliminar-cuenta]
verify_jwt = true

# transcribir-pdf (reemplazo de OCR por IA para pliegos escaneados): la llama el navegador con la
# sesión activa del usuario, igual que extraer-requisitos.
[functions.transcribir-pdf]
verify_jwt = true

# ----------------------------------------------------------------------------
# SEG-001 -- Autenticación del proyecto REAL (se configura en el panel de Supabase, no aquí).
# Estado medido el 2026-09-27 con GET /auth/v1/settings: mailer_autoconfirm = true y
# disable_signup = false, es decir, cualquiera crea una cuenta con un correo AJENO y obtiene
# sesión inmediata (pre-secuestro de cuentas, cuentas ilimitadas, correos a terceros).
# Se dejan comentados a propósito: `supabase config push` sobrescribiría también el Site URL y los
# Redirect URLs (de los que depende "recuperar contraseña") con los valores por defecto.
#
# Pasos en Authentication (panel de Supabase):
#   - Sign In / Providers > Email > "Confirm email": ACTIVADO.
#   - Sign In / Providers > Email > "Minimum password length": 8, y "Password requirements" con
#     letras y números; activar "Prevent use of leaked passwords" si el plan lo permite.
#   - Attack Protection: activar CAPTCHA (Cloudflare Turnstile o hCaptcha) -- requiere una clave
#     del proveedor y un cambio en el formulario de registro.
#   - Rate Limits: revisar los límites de correos y de registros por hora e IP.
# Comprobación: GET https://<proyecto>.supabase.co/auth/v1/settings con la anon key debe mostrar
# "mailer_autoconfirm": false, y signUp no debe devolver sesión hasta confirmar el correo.
# [auth.email]
# enable_confirmations = true
# [auth]
# minimum_password_length = 8
